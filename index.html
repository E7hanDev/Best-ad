<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Big League Motion Ad // Exact Replica</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #050505; color: #fff; font-family: 'SF Mono', monospace; overflow: hidden; }
        
        .viewport { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        /* The exact "Slide & Blur" transition from the video */
        .frame { 
            position: absolute; 
            width: 90%; max-width: 800px;
            opacity: 0;
            transform: scale(1.05) blur(10px);
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: none;
        }
        .frame.active { display: block; opacity: 1; transform: scale(1) blur(0); }

        /* Cursor UI Box */
        .ui-box { background: #0d0d0d; border: 1px solid #222; border-radius: 8px; padding: 30px; box-shadow: 0 30px 60px rgba(0,0,0,0.8); }
        .header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; color: #666; font-size: 12px; }
        .status-pill { background: #1a1a1a; padding: 3px 8px; border-radius: 10px; color: #fff; border: 1px solid #333; }
        .text-big { font-size: 32px; font-weight: 700; margin-bottom: 10px; }
        .code-line { color: #888; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="viewport">
    <!-- F1: The POV Hook -->
    <div class="frame active" id="f1">
        <div class="ui-box">
            <div class="header"><div class="status-pill">POV</div> User requested a Big League Motion Ad</div>
            <div class="text-big">Big League Motion Ad</div>
        </div>
    </div>

    <!-- F2: The Coding Interface -->
    <div class="frame" id="f2">
        <div class="ui-box">
            <div class="header"><div class="status-pill">AGENT</div> Building Landing Page</div>
            <div class="code-line">> make a landing page based on attached doc</div>
            <div class="code-line">> explaining what we do</div>
        </div>
    </div>

    <!-- F3: Mission Control -->
    <div class="frame" id="f3">
        <div class="ui-box">
            <div class="header"><div class="status-pill">MISSION CONTROL</div> Composer 1.5</div>
            <div class="text-big" style="color: #00f2fe;">READY TO LAUNCH</div>
        </div>
    </div>
</div>

<script>
    const frames = document.querySelectorAll('.frame');
    let i = 0;
    
    function loop() {
        frames[i].classList.remove('active');
        i = (i + 1) % frames.length;
        frames[i].classList.add('active');
        setTimeout(loop, 2000); // Sync to video speed
    }
    setTimeout(loop, 2000);
</script>

</body>
</html>
